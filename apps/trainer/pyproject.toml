[project]
name = "trainer"
version = "0.1.1"
description = "シーン分類（時間帯・天候）の小さな CNN を、PyTorch CPU + DDP（gloo）で学習する。Kubeflow Trainer（torchrun）と Ray Train（RayJob）の両方から起動できる。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# バージョンは固定する。
# 実行イメージ（rayproject/ray:2.59.1-py312-cpu）に最初から入っている版と揃えて、
# イメージ内のパッケージを入れ替えないようにしている（pyarrow / protobuf など。変換器と同じ）。
dependencies = [
    # Ray Data が S3 / HTTP のパスを扱うときに fsspec 経由で使う（Ray イメージに入っている版）
    "aiohttp==3.14.4",
    "mlflow-skinny==3.18.0",
    "numpy==2.2.6",
    "pillow==13.0.0",
    "protobuf==6.33.6",
    "pyarrow==23.0.1",
    "ray[train]==2.59.1",
    "torch==2.15.0",
]

[project.scripts]
# `trainer train-torchrun|train-ray|register|trace|wait-trainjob` で CLI を起動できるようにする
trainer = "trainer.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

# torch は Linux では CPU 専用の配布元から入れる。
# PyPI の Linux 版 torch は arm64 でも CUDA のライブラリ（nvidia-*、数 GB）を一緒に引き込むため。
# Linux 以外（ホストでのテスト）は PyPI の版がもともと CPU 専用なので、PyPI から入れる。
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# torch 以外のパッケージはこの配布元から取らない（明示したものだけ）
explicit = true

[tool.uv]
# 直接は使わないが、Ray イメージに入っている版と揃えたい間接依存を固定する（変換器と同じ考え方）。
# イメージに入っている版をそのまま使い、学習器を入れるときにイメージ内のパッケージを入れ替えないようにする
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "cachetools==5.5.2",
    "certifi==2026.10.19",
    "cffi==1.17.1",
    "charset-normalizer==3.4.7",
    "click==8.3.2",
    "cloudpickle==3.1.1",
    "cryptography==44.0.3",
    "fastapi==0.133.0",
    "filelock==3.29.0",
    "fsspec==2023.12.1",
    "google-auth==2.39.0",
    "idna==3.18",
    "importlib-metadata==6.11.0",
    "jsonschema==4.24.1",
    "lz4==4.4.5",
    "markupsafe==3.0.3",
    "msgpack==1.1.2",
    "multidict==6.7.1",
    "opentelemetry-api==1.39.0",
    "opentelemetry-proto==1.39.0",
    "opentelemetry-sdk==1.39.0",
    "packaging==26.3",
    "pandas==2.3.3",
    "propcache==0.4.1",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pydantic==2.12.3",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2022.7.1",
    "pyyaml==6.0.3",
    "referencing==0.36.2",
    "requests==2.33.1",
    "rpds-py==0.30.0",
    "rsa==4.7.2",
    "setuptools==80.9.0",
    "starlette==1.0.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "tzdata==2026.1",
    "urllib3==1.26.20",
    "uvicorn==0.22.0",
    "zipp==3.23.1",
    "zstandard==0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
