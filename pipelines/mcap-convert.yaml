# MCAP 変換パイプライン（フェーズ 2、フェーズ 3 で Kueue 経由に変更）。
#
#   1. discover … raw の metadata.json と derived の _manifests / _quarantine を突き合わせ、未処理のセッションを数える
#   2. convert  … 未処理が 1 件以上あれば RayJob を作り（Ray クラスタを立てて）Ray Data で変換する。
#                  RayJob は suspend: true で作り、Kueue のキュー（LocalQueue）で順番を待つ。
#                  Kueue が受け入れる（枠が空く）と suspend が外れ、Ray クラスタが立ち上がる。
#                  終わったら Ray クラスタは自動で消える（shutdownAfterJobFinishes）
#   3. validate … DuckDB で Parquet の行数を数え、metadata.json の message_count と照合する
#
# 実行:  argo submit -n mlops --from workflowtemplate/mcap-convert --watch
#        argo submit -n mlops --from workflowtemplate/mcap-convert -p force=true        # 作り直し
#        argo submit -n mlops --from workflowtemplate/mcap-convert -p device-id=dev-011 -p priority=high
# 登録:  docs/setup/02-pipeline.md の手順（OWNER を GitHub のユーザー名に置き換えて kubectl apply）
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: mcap-convert
  namespace: mlops
  labels:
    app.kubernetes.io/part-of: mini-mlops
spec:
  entrypoint: main
  serviceAccountName: mcap-pipeline
  # GHCR（非公開）から変換器のイメージを取るための Secret（docs/setup/02-pipeline.md で作る）
  imagePullSecrets:
    - name: ghcr-pull
  arguments:
    parameters:
      - name: converter-image
        # タグ = apps/converter/pyproject.toml の version（= マニフェストに記録される変換器のバージョン）。
        # version を上げたらここも上げる（変換器のテストで一致を確かめている）。
        # OWNER は登録するときに GitHub のユーザー名に置き換える（docs/setup/02-pipeline.md）
        value: ghcr.io/OWNER/mini-mlops-converter:0.2.0
      - name: force
        value: "false"
        enum: ["false", "true"]
        description: true にすると、変換済み・隔離済みのセッションも作り直す
      - name: fail-on-quarantine
        value: "false"
        enum: ["false", "true"]
        description: true にすると、隔離されたセッションがあればワークフローを失敗にする
      - name: device-id
        value: ""
        description: 対象のデバイス（例 dev-011）。空なら全デバイス
      - name: priority
        value: low
        enum: ["low", "high"]
        description: Kueue の優先度（WorkloadPriorityClass）。待ち行列では high が先に受け入れられる
      - name: queue-name
        value: data-processing
        description: RayJob を入れる Kueue の LocalQueue（プリエンプションの観察では preemption-test を指定する）
  # 同じデバイスのワークフローが同時に 2 つ走ると、同じセッションを取り合う。
  # そこで、デバイスごとのロック（mutex）で「同じデバイスは 1 つずつ」にする。
  # 別のデバイスのワークフローは並んで動き、RayJob の順番待ちは Kueue のキューに任せる。
  # 注意: device-id を空（全デバイス）にしたワークフローのロック名は "mcap-convert-" になり、
  #       デバイスを指定したワークフローとは別のロックになる。全デバイスの実行と、デバイス指定の実行は同時に投げないこと
  synchronization:
    mutexes:
      - name: "mcap-convert-{{workflow.parameters.device-id}}"
  # ワークフロー全体の制限時間（6 時間）= Kueue での待ち時間 + 変換の実行時間。
  # 変換そのものの制限時間は、RayJob の activeDeadlineSeconds（30 分）で別に決めている。
  # 待ちが長引いてもワークフローが先に失敗しないよう、こちらは長めにしてある
  activeDeadlineSeconds: 21600
  # 完了したワークフローは 7 日後に消す（ログは s3://argo-artifacts に残っている）
  ttlStrategy:
    secondsAfterCompletion: 604800
  # 成功した Pod は 10 分後に消す（失敗した Pod は調査のため残す）
  podGC:
    strategy: OnPodSuccess
    deleteDelayDuration: 10m

  templates:
    - name: main
      steps:
        - - name: discover
            template: discover
        - - name: convert
            template: convert
            # 未処理が 0 件なら Ray クラスタを立てずにスキップする
            when: "{{steps.discover.outputs.parameters.pending}} > 0"
        - - name: validate
            template: validate

    # 1. 未処理のセッションを数える（Ray は使わない軽い処理）
    - name: discover
      outputs:
        parameters:
          - name: pending
            valueFrom:
              path: /tmp/pending
      container:
        image: "{{workflow.parameters.converter-image}}"
        command:
          - converter
          - discover
          - "--force={{workflow.parameters.force}}"
          - "--device-id={{workflow.parameters.device-id}}"
          - --output-file
          - /tmp/pending
        envFrom:
          - configMapRef: { name: pipeline-s3 }
          - secretRef: { name: pipeline-s3-credentials }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }

    # 2. RayJob を作って変換する。RayJob の状態を見張り、成功 / 失敗をワークフローに反映する
    - name: convert
      outputs:
        parameters:
          # 作られた RayJob の名前（ログを見るとき用: kubectl -n mlops logs job/<名前>）
          - name: rayjob-name
            valueFrom:
              jsonPath: "{.metadata.name}"
      resource:
        action: create
        # RayJob の持ち主をこのワークフローにする → ワークフローが消えると RayJob も消える
        setOwnerReference: true
        # Ray のジョブ（converter convert）が成功したら成功
        successCondition: status.jobStatus == SUCCEEDED
        # ジョブの失敗・期限切れ・submitter の失敗などは、すべて jobDeploymentStatus が Failed になる。
        # ValidationFailed は RayJob の書き方の誤り（KubeRay が受け付けない）
        # Kueue で待っている間は Suspended（どちらにも当たらないので、ワークフローは待ち続ける）
        failureCondition: status.jobDeploymentStatus in (Failed, ValidationFailed)
        manifest: |
          apiVersion: ray.io/v1
          kind: RayJob
          metadata:
            generateName: mcap-convert-
            labels:
              app.kubernetes.io/part-of: mini-mlops
              app.kubernetes.io/component: converter
              # どのデバイスの変換か（kubectl get rayjob -L mini-mlops/device-id で見える。空 = 全デバイス）
              mini-mlops/device-id: "{{workflow.parameters.device-id}}"
              # Kueue: この RayJob を入れるキュー（Namespace mlops の LocalQueue）。
              # このラベルがあるジョブだけを Kueue が管理する（基盤部品などラベルの無いものには触れない）
              kueue.x-k8s.io/queue-name: "{{workflow.parameters.queue-name}}"
              # Kueue: 優先度（WorkloadPriorityClass の名前）。待ち行列では高いものから受け入れられる
              kueue.x-k8s.io/priority-class: "{{workflow.parameters.priority}}"
          spec:
            # Kueue が受け入れるまで Ray クラスタを作らない（Kueue が受け入れると false に書き換える）。
            # Kueue の webhook も同じことをするが、意図が分かるように明示しておく
            suspend: true
            # Ray クラスタの head 上で実行されるコマンド（変換の本体）。未処理の判定は中でもう一度行う
            entrypoint: converter convert --force={{workflow.parameters.force}} --device-id={{workflow.parameters.device-id}}
            # ジョブが終わったら Ray クラスタ（head / worker の Pod）を消す。
            # 120 秒待つのは、終了直後の Ray Dashboard やログを確認できるようにするため
            shutdownAfterJobFinishes: true
            ttlSecondsAfterFinished: 120
            # 変換の実行時間の上限（30 分）。KubeRay は Kueue に受け入れられて suspend が外れた時点で
            # 開始時刻（status.startTime）を付け直すので、キューで待っていた時間は含まれない
            # （KubeRay v1.7.2 の rayjob_controller.go の initRayJobStatusIfNeed で確認）
            activeDeadlineSeconds: 1800
            # 失敗しても RayJob としては再試行しない（再実行はワークフローごとやり直す）
            backoffLimit: 0
            # ジョブを投入する Pod（K8sJobMode。`kubectl logs job/<RayJob 名>` でジョブのログを追える）
            submitterPodTemplate:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                imagePullSecrets:
                  - name: ghcr-pull
                containers:
                  - name: ray-job-submitter
                    image: "{{workflow.parameters.converter-image}}"
                    resources:
                      requests: { cpu: 100m, memory: 256Mi }
                      limits: { cpu: 500m, memory: 512Mi }
            rayClusterSpec:
              rayVersion: "2.59.1"
              # head: GCS・Dashboard・ジョブのドライバ（converter convert）が動く。
              # num-cpus=0 にして、変換タスクは head に載せず worker だけで実行する
              headGroupSpec:
                rayStartParams:
                  num-cpus: "0"
                  # オブジェクトストア（共有メモリ）の上限。メモリ limit の内側から確保される
                  object-store-memory: "200000000"
                  dashboard-host: "0.0.0.0"
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/part-of: mini-mlops
                  spec:
                    automountServiceAccountToken: false
                    imagePullSecrets:
                      - name: ghcr-pull
                    containers:
                      - name: ray-head
                        image: "{{workflow.parameters.converter-image}}"
                        env:
                          - name: CONVERTER_IMAGE
                            value: "{{workflow.parameters.converter-image}}"
                        envFrom:
                          - configMapRef: { name: pipeline-s3 }
                          - secretRef: { name: pipeline-s3-credentials }
                        # Ray 2.59 の head は、Dashboard の子プロセスなどだけで約 2.3GB 使う
                        resources:
                          requests: { cpu: 500m, memory: 2560Mi }
                          limits: { cpu: "1", memory: 3Gi }
              # worker 2 台: read_mcap の読み取り・変換・書き込みのタスクが動く
              workerGroupSpecs:
                - groupName: cpu
                  replicas: 2
                  minReplicas: 2
                  maxReplicas: 2
                  rayStartParams:
                    object-store-memory: "250000000"
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/part-of: mini-mlops
                    spec:
                      automountServiceAccountToken: false
                      imagePullSecrets:
                        - name: ghcr-pull
                      containers:
                        - name: ray-worker
                          image: "{{workflow.parameters.converter-image}}"
                          env:
                            - name: CONVERTER_IMAGE
                              value: "{{workflow.parameters.converter-image}}"
                          envFrom:
                            - configMapRef: { name: pipeline-s3 }
                            - secretRef: { name: pipeline-s3-credentials }
                          # CPU limit 1 → Ray は num-cpus=1 として扱う（同時に 1 タスク）
                          resources:
                            requests: { cpu: 500m, memory: 1Gi }
                            limits: { cpu: "1", memory: 1280Mi }

    # 3. DuckDB で行数を照合する
    - name: validate
      outputs:
        parameters:
          # 例: {"sessions": 7, "ok": 6, "quarantined": 1, "mismatch": 0, ...}
          - name: summary
            valueFrom:
              path: /tmp/summary.json
      container:
        image: "{{workflow.parameters.converter-image}}"
        command:
          - converter
          - validate
          - "--fail-on-quarantine={{workflow.parameters.fail-on-quarantine}}"
          - "--device-id={{workflow.parameters.device-id}}"
          - --summary-file
          - /tmp/summary.json
        envFrom:
          - configMapRef: { name: pipeline-s3 }
          - secretRef: { name: pipeline-s3-credentials }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 512Mi }
