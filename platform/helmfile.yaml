# プラットフォーム部品（基盤）を Helmfile でまとめて管理する。
# 使い方は platform/README.md を参照。
#
# バージョンは必ず固定する（latest は使わない）。

repositories:
  - name: longhorn
    url: https://charts.longhorn.io
  - name: seaweedfs
    url: https://seaweedfs.github.io/seaweedfs/helm
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: kuberay
    url: https://ray-project.github.io/kuberay-helm/

releases:
  # 分散ブロックストレージ。default StorageClass `longhorn` を作る。フェーズ 0 で導入。
  # 他の部品の PVC はすべてこれを使うので、最初に入れて起動を待つ（wait）。
  # 先にノードの準備が必要（open-iscsi など）: docs/setup/00-longhorn.md 手順 2
  - name: longhorn
    namespace: longhorn-system
    createNamespace: true
    chart: longhorn/longhorn
    version: 1.12.2
    wait: true
    timeout: 900
    values:
      - values/longhorn.yaml

  # S3 互換ストレージ。フェーズ 1 で導入。
  # PVC を Longhorn に作るので、Longhorn の後に入れる（needs）
  - name: seaweedfs
    namespace: storage
    createNamespace: true
    chart: seaweedfs/seaweedfs
    version: 4.52.0
    needs:
      - longhorn-system/longhorn
    values:
      - values/seaweedfs.yaml

  # ワークフローエンジン。フェーズ 2 で導入。
  # controller / server は argo、ワークフローの Pod は mlops で動く（values 参照）
  - name: argo-workflows
    namespace: argo
    createNamespace: true
    chart: argo/argo-workflows
    version: 2.0.18
    values:
      - values/argo-workflows.yaml

  # Ray クラスタの operator（RayJob を作ると head / worker の Pod を立てる）。フェーズ 2 で導入。
  - name: kuberay-operator
    namespace: ray-system
    createNamespace: true
    chart: kuberay/kuberay-operator
    version: 1.7.2
    values:
      - values/kuberay-operator.yaml
