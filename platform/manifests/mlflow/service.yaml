# クラスタ内からは http://mlflow.mlflow.svc:5000、ホストからは
#   kubectl -n mlflow port-forward svc/mlflow 5050:5000 → http://localhost:5050
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: mini-mlops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
