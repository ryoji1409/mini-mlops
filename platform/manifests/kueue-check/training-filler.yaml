# 確認用: training の枠を埋めるダミーの Job（docs/setup/03-kueue.md 手順 8「貸し借り」）。
# training の LocalQueue に入れる batch/v1 Job なので、batch/job 連携の確認も兼ねる。
#
# 4 Pod × 500m / 1Gi = 2 CPU / 4Gi（training の枠 2 CPU / 4.5Gi をほぼ使い切る）。
# これが動いている間、data-processing は training から枠を借りられないので、変換は 1 本ずつになる。
# sleep するだけなので実際の CPU はほとんど使わないが、requests の分はノードの空きを予約する
# （実際の空き 約 4.5 CPU から、これ 2 CPU + 変換 1 本 1.6 CPU を引いても収まる）。
#
# 作る:  kubectl create -f platform/manifests/kueue-check/training-filler.yaml
# 消す:  kubectl -n training delete job training-filler
apiVersion: batch/v1
kind: Job
metadata:
  name: training-filler
  namespace: training
  labels:
    app.kubernetes.io/part-of: mini-mlops
    kueue.x-k8s.io/queue-name: training
    kueue.x-k8s.io/priority-class: low
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  # 消し忘れても 30 分で終わり、終わって 10 分後に Job ごと消える
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mini-mlops
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: sleep
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 1800"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 500m, memory: 1Gi }
