# ワークフロー（Namespace mlops の ServiceAccount train-pipeline）が、Namespace training に
# TrainJob / RayJob を作り、状態を見張るための最小限の権限。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: train-pipeline
  namespace: training
  labels:
    app.kubernetes.io/part-of: mini-mlops
rules:
  # 削除は与えない（片付けは手順書で確認してから手で行う）
  - apiGroups: ["trainer.kubeflow.org"]
    resources: ["trainjobs"]
    verbs: ["create", "get", "list", "watch", "patch"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs"]
    verbs: ["create", "get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: train-pipeline
  namespace: training
  labels:
    app.kubernetes.io/part-of: mini-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: train-pipeline
subjects:
  - kind: ServiceAccount
    name: train-pipeline
    namespace: mlops
